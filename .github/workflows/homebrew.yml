name: Homebrew

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  homebrew:
    name: Homebrew formula
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Library/Homebrew/vendor/bundle
          key: homebrew-${{ runner.os }}-${{ hashFiles('Formula/excalc.rb') }}
          restore-keys: |
            homebrew-${{ runner.os }}-
      - name: Tap this checkout
        run: brew tap dblock/excalc-rs "$GITHUB_WORKSPACE"
      - name: Trust formula
        run: brew trust --formula dblock/excalc-rs/excalc
      - name: Audit formula
        run: brew audit --strict dblock/excalc-rs/excalc
      - name: Install formula
        run: brew install --build-from-source dblock/excalc-rs/excalc
      - name: Test formula
        run: brew test dblock/excalc-rs/excalc
