name: Lint

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

  dylint:
    name: Dylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: dylint
      - name: Cache Dylint libraries, drivers, and toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git/checkouts
            ~/.dylint_drivers
            ~/.rustup/toolchains/nightly-*
            target/dylint/libraries
          key: dylint-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', '.github/workflows/lint.yml') }}
      - name: Install Dylint
        run: cargo install cargo-dylint dylint-link --version 6.3.2 --locked
      - name: Dylint
        env:
          RUSTFLAGS: -D warnings
        run: cargo dylint --all -- --all-targets --all-features
      - name: Dylint (no default features)
        env:
          RUSTFLAGS: -D warnings
        run: cargo dylint --all -- --all-targets --no-default-features
