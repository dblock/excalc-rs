name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional explicit stable crate version (defaults to Cargo.toml)"
        required: false
        type: string
      tag:
        description: "Existing release tag for artifact-only rebuilds (skips publishing; leave version blank)"
        required: false
        type: string

permissions:
  actions: read
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Release crate
    if: inputs.tag == ''
    uses: dblock/rust-crate-release/.github/workflows/release.yml@v0.1.1
    with:
      tool-ref: v0.1.1
      version: ${{ inputs.version }}

  release-tag:
    name: Resolve artifact release
    needs: publish
    if: ${{ always() && github.ref == 'refs/heads/master' && (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && inputs.tag != '' && inputs.version == '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Verify release exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || format('v{0}', needs.publish.outputs.version) }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  archives:
    name: Archive (${{ matrix.entry.target }})
    needs: release-tag
    if: ${{ !cancelled() && needs.release-tag.result == 'success' }}
    runs-on: ${{ matrix.entry.runner }}
    env:
      RELEASE_TAG: ${{ needs.release-tag.outputs.tag }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { target: aarch64-apple-darwin, runner: macos-15, format: tar }
          - { target: x86_64-apple-darwin, runner: macos-15-intel, format: tar }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-22.04-arm, format: tar }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-22.04, format: tar }
          - { target: x86_64-pc-windows-msvc, runner: windows-2022, format: zip }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.entry.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.entry.target }}
      - name: Install musl tools
        if: contains(matrix.entry.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build binaries
        run: cargo build --release --target "${{ matrix.entry.target }}" --bin excalc --bin calc --bin excalc-mcp
      - name: Package Unix archive
        if: matrix.entry.format == 'tar'
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          name="excalc-${version}-${{ matrix.entry.target }}"
          mkdir -p "target/release-archives/${name}"
          cp "target/${{ matrix.entry.target }}/release/excalc" "target/${{ matrix.entry.target }}/release/calc" "target/${{ matrix.entry.target }}/release/excalc-mcp" README.md CHANGELOG.md LICENSE "target/release-archives/${name}/"
          tar -C target/release-archives -czf "target/release-archives/${name}.tar.gz" "${name}"
          cd target/release-archives
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
      - name: Package Windows archive
        if: matrix.entry.format == 'zip'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          $name = "excalc-$version-${{ matrix.entry.target }}"
          $directory = "target/release-archives/$name"
          New-Item -ItemType Directory -Force -Path $directory
          Copy-Item "target/${{ matrix.entry.target }}/release/excalc.exe", "target/${{ matrix.entry.target }}/release/calc.exe", "target/${{ matrix.entry.target }}/release/excalc-mcp.exe", "README.md", "CHANGELOG.md", "LICENSE" -Destination $directory
          Compress-Archive -Path "$directory/*" -DestinationPath "target/release-archives/$name.zip"
          $hash = (Get-FileHash "target/release-archives/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "target/release-archives/$name.zip.sha256"
      - name: Upload Unix archive to release
        if: matrix.entry.format == 'tar'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" target/release-archives/*.tar.gz target/release-archives/*.sha256 --clobber
      - name: Upload Windows archive to release
        if: matrix.entry.format == 'zip'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload "$env:RELEASE_TAG" target/release-archives/*.zip target/release-archives/*.sha256 --clobber

  msi:
    name: Attach MSI installer to release
    needs: release-tag
    if: ${{ !cancelled() && needs.release-tag.result == 'success' }}
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.release-tag.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache cargo-wix binary
        id: cache-cargo-wix
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-wix.exe
          key: cargo-wix-0.3.9-${{ runner.os }}
      - name: Install cargo-wix
        if: steps.cache-cargo-wix.outputs.cache-hit != 'true'
        run: cargo install cargo-wix --version 0.3.9 --locked
      - name: Build MSI
        run: cargo wix --nocapture
      - name: Upload MSI to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:RELEASE_TAG" target/wix/*.msi --clobber

  homebrew:
    name: Update Homebrew formula
    needs: [publish, release-tag, archives, msi]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.archives.result == 'success' && needs.msi.result == 'success' }}
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ needs.release-tag.outputs.tag }}
    permissions:
      contents: write
    concurrency:
      group: homebrew-formula-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Update formula URL and checksum
        run: |
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${RELEASE_TAG}.tar.gz" -o "$RUNNER_TEMP/excalc.tar.gz"
          archive_sha="$(shasum -a 256 "$RUNNER_TEMP/excalc.tar.gz" | awk '{print $1}')"
          ARCHIVE_SHA="$archive_sha" ruby -pi -e 'gsub(%r{/refs/tags/v[^/"]+\.tar\.gz}, "/refs/tags/#{ENV.fetch("RELEASE_TAG")}.tar.gz"); gsub(/sha256 "[0-9a-f]+"/, "sha256 #{ENV.fetch("ARCHIVE_SHA").inspect}")' Formula/excalc.rb
      - name: Tap this checkout
        run: brew tap dblock/excalc-rs "$GITHUB_WORKSPACE"
      - name: Trust formula
        run: brew trust --formula dblock/excalc-rs/excalc
      - name: Audit formula
        run: brew audit --strict dblock/excalc-rs/excalc
      - name: Install formula
        run: brew install --build-from-source dblock/excalc-rs/excalc
      - name: Test formula
        run: brew test dblock/excalc-rs/excalc
      - name: Clean up Homebrew
        if: always()
        run: |
          brew uninstall --force excalc || true
          brew untap --force dblock/excalc-rs || true
      - name: Commit and push formula
        run: |
          if git diff --quiet -- Formula/excalc.rb; then
            echo "Formula already points at ${RELEASE_TAG}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/excalc.rb
          git commit -m "Update Homebrew formula to ${RELEASE_TAG}" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:master
