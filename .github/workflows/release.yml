name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach artifacts to (defaults to the triggering release)"
        required: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  publish:
    name: Publish crate
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  archives:
    name: Archive (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            format: tar
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            format: tar
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
            format: tar
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
            format: tar
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            format: zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build binaries
        run: cargo build --release --target "${{ matrix.target }}" --bin excalc --bin calc --bin excalc-mcp
      - name: Package Unix archive
        if: matrix.format == 'tar'
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          name="excalc-${version}-${{ matrix.target }}"
          mkdir -p "target/release-archives/${name}"
          cp "target/${{ matrix.target }}/release/excalc" "target/${{ matrix.target }}/release/calc" "target/${{ matrix.target }}/release/excalc-mcp" README.md CHANGELOG.md LICENSE "target/release-archives/${name}/"
          tar -C target/release-archives -czf "target/release-archives/${name}.tar.gz" "${name}"
          cd target/release-archives
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
      - name: Package Windows archive
        if: matrix.format == 'zip'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          $name = "excalc-$version-${{ matrix.target }}"
          $directory = "target/release-archives/$name"
          New-Item -ItemType Directory -Force -Path $directory
          Copy-Item "target/${{ matrix.target }}/release/excalc.exe", "target/${{ matrix.target }}/release/calc.exe", "target/${{ matrix.target }}/release/excalc-mcp.exe", "README.md", "CHANGELOG.md", "LICENSE" -Destination $directory
          Compress-Archive -Path "$directory/*" -DestinationPath "target/release-archives/$name.zip"
          $hash = (Get-FileHash "target/release-archives/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "target/release-archives/$name.zip.sha256"
      - name: Upload Unix archive to release
        if: matrix.format == 'tar'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" target/release-archives/*.tar.gz target/release-archives/*.sha256 --clobber
      - name: Upload Windows archive to release
        if: matrix.format == 'zip'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload "$env:RELEASE_TAG" target/release-archives/*.zip target/release-archives/*.sha256 --clobber

  msi:
    name: Attach MSI installer to release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache cargo-wix binary
        id: cache-cargo-wix
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-wix.exe
          key: cargo-wix-0.3.9-${{ runner.os }}
      - name: Install cargo-wix
        if: steps.cache-cargo-wix.outputs.cache-hit != 'true'
        run: cargo install cargo-wix --version 0.3.9 --locked
      - name: Build MSI
        run: cargo wix --nocapture
      - name: Upload MSI to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:RELEASE_TAG" target/wix/*.msi --clobber

  homebrew:
    name: Update Homebrew formula
    needs: [publish, archives, msi]
    if: ${{ always() && github.event_name == 'release' && needs.publish.result == 'success' && needs.archives.result == 'success' && needs.msi.result == 'success' }}
    runs-on: macos-latest
    permissions:
      contents: write
    concurrency:
      group: homebrew-formula-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Update formula URL and checksum
        run: |
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${RELEASE_TAG}.tar.gz" -o "$RUNNER_TEMP/excalc.tar.gz"
          archive_sha="$(shasum -a 256 "$RUNNER_TEMP/excalc.tar.gz" | awk '{print $1}')"
          ARCHIVE_SHA="$archive_sha" ruby -pi -e 'gsub(%r{/refs/tags/v[^/"]+\.tar\.gz}, "/refs/tags/#{ENV.fetch("RELEASE_TAG")}.tar.gz"); gsub(/sha256 "[0-9a-f]+"/, "sha256 #{ENV.fetch("ARCHIVE_SHA").inspect}")' Formula/excalc.rb
      - name: Tap this checkout
        run: brew tap dblock/excalc-rs "$GITHUB_WORKSPACE"
      - name: Audit formula
        run: brew audit --strict dblock/excalc-rs/excalc
      - name: Install formula
        run: brew install --build-from-source dblock/excalc-rs/excalc
      - name: Test formula
        run: brew test dblock/excalc-rs/excalc
      - name: Clean up Homebrew
        if: always()
        run: |
          brew uninstall --force excalc || true
          brew untap --force dblock/excalc-rs || true
      - name: Commit and push formula
        run: |
          if git diff --quiet -- Formula/excalc.rb; then
            echo "Formula already points at ${RELEASE_TAG}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/excalc.rb
          git commit -m "Update Homebrew formula to ${RELEASE_TAG}" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:master
