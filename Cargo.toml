[package]
name = "excalc"
version = "0.1.0"
edition = "2021"
authors = ["Daniel Doubrovkine and contributors"]
description = "An expression calculator CLI tool and MCP server built for AI coding agents to outsource arithmetic."
license = "MIT"
repository = "https://github.com/dblock/excalc-rs"

[lib]
name = "excalc"
path = "src/lib.rs"

[[bin]]
name = "excalc"
path = "src/main.rs"

[[bin]]
name = "calc"
path = "src/main.rs"

[[bin]]
name = "excalc-mcp"
path = "src/bin/excalc-mcp.rs"
required-features = ["mcp"]

[[test]]
name = "mcp"
path = "tests/mcp.rs"
required-features = ["mcp"]

[features]
default = ["mcp"]
mcp = ["dep:rmcp", "dep:tokio", "dep:serde", "dep:anyhow"]

[dependencies]
thiserror = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.10"
rmcp = { version = "3.4", features = ["server", "macros", "transport-io"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
anyhow = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
